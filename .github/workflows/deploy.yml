name: Refresh research data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 09:20 Asia/Seoul, after the provider's daily UTC quota reset.
    - cron: '20 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: pip install -r scripts/requirements.txt
      - name: Restore last published neuroscience snapshot
        run: python scripts/refresh_neuroscience.py --restore-only
      - name: Refresh neuroscience snapshot
        id: neuroscience
        continue-on-error: true
        run: python scripts/refresh_neuroscience.py
      - name: Refresh Nature editorial listings
        id: editorial
        continue-on-error: true
        run: python scripts/refresh_editorial.py
      - name: Report retained neuroscience snapshot
        if: steps.neuroscience.outcome == 'failure' || steps.editorial.outcome == 'failure'
        run: echo '::warning::A neuroscience source refresh failed. Its last successful snapshot and original date are retained.'
      - name: Verify neuroscience data contracts
        run: python scripts/test_neuroscience.py
      - name: Refresh OpenAlex snapshot
        id: refresh
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/refresh_data.py
      - name: Report retained snapshot
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::OpenAlex refresh failed. Deploying the previous snapshot with its original date.'
      - name: Restore last published quantum snapshot
        run: python scripts/refresh_quantum.py --restore-only
      - name: Refresh quantum computing snapshot
        id: quantum
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/refresh_quantum.py
      - name: Report retained quantum snapshot
        if: steps.quantum.outcome == 'failure'
        run: echo '::warning::Quantum refresh failed. Retaining the last successful snapshot and its date.'
      - name: Require quantum snapshot
        run: test -f public/data/quantum-computing.json
      - name: Verify quantum data contracts
        run: python scripts/test_quantum.py
      - name: Restore last published longevity snapshot
        run: python scripts/refresh_longevity.py --restore-only
      - name: Refresh longevity snapshot
        id: longevity
        continue-on-error: true
        run: python scripts/refresh_longevity.py
      - name: Report retained longevity snapshot
        if: steps.longevity.outcome == 'failure'
        run: echo '::warning::Longevity refresh failed. Retaining the last successful snapshot and its date.'
      - name: Refresh public trial registry metadata
        run: python scripts/refresh_longevity_trials.py
      - name: Verify longevity data contracts
        run: python scripts/test_longevity.py
      - name: Refresh official Nobel award records
        id: nobel
        continue-on-error: true
        run: python scripts/refresh_nobel.py
      - name: Report retained Nobel snapshot
        if: steps.nobel.outcome == 'failure'
        run: echo '::warning::Nobel API refresh failed. Retaining the checked-in award index and its original date; the sourced bibliography remains available.'
      - name: Verify Nobel award and bibliography contracts
        run: python scripts/test_nobel.py
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
