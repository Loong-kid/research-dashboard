name: Refresh research data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:20 Asia/Seoul; GitHub may delay scheduled jobs.
    - cron: '20 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Refresh OpenAlex snapshot
        id: refresh
        continue-on-error: true
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/refresh_data.py
      - name: Report retained snapshot
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::OpenAlex refresh failed. Deploying the previous snapshot with its original date.'
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
